[project]
name = "job-scraper"
version = "0.1.0"
description = "Job aggregation and filtering tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.3.3",
    "python-jobspy>=1.1.82",
    "requests>=2.34.2",
]

[project.scripts]
job-scraper = "job_scraper.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
